<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eyepatch Settings</title>
    <link rel="stylesheet" href="ui/eyepatch.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <div class="title-block">
        <div class="page-title"><span id="mark"></span><h1>Settings</h1></div>
        <ul id="setup-done" class="setup-done" aria-label="Setup" hidden></ul>
      </div>

      <section id="setup" class="section" aria-labelledby="setup-h" hidden>
        <div class="section-head"><h2 id="setup-h">Setup</h2><span id="setup-count" class="muted"></span></div>
        <ol id="steps" class="steps"></ol>
      </section>

      <section id="agents-section" class="section" aria-labelledby="agents-h" hidden>
        <h2 id="agents-h">Agents</h2>
        <div id="agents"></div>
        <div id="add-status"></div>
        <button id="add-btn" type="button" class="row add-row"><span class="tile add-tile"><svg data-icon="plus"></svg></span><span class="main"><span class="name">Add an agent</span></span></button>
      </section>

      <section id="mods-section" class="section" aria-labelledby="mods-h" hidden>
        <h2 id="mods-h">Mods</h2>
        <div id="mods" class="mod-groups"></div>
        <div id="mods-status" class="mods-status"></div>
        <button id="import-btn" type="button" class="row add-row"><span class="tile add-tile"><svg data-icon="plus"></svg></span><span class="main"><span class="name">Import a mod</span></span></button>
        <input id="import-file" type="file" accept=".js,.css" multiple hidden />
      </section>
    </main>

    <dialog id="add-dialog" class="dialog" aria-labelledby="add-h">
      <div class="dialog-head">
        <h2 id="add-h">Add an agent</h2>
        <button id="add-close" type="button" class="icon-btn" aria-label="Close"><svg data-icon="x"></svg></button>
      </div>
      <div class="dialog-search"><label class="search"><svg data-icon="search" data-size="16"></svg><input id="add-filter" type="search" placeholder="Search agents" aria-label="Search agents" /></label></div>
      <div id="add-list" class="add-list" role="list"></div>
    </dialog>
    <dialog id="install-dialog" class="dialog" aria-labelledby="install-h">
      <div class="dialog-head">
        <h2 id="install-h">Install mod</h2>
        <button id="install-close" type="button" class="icon-btn" aria-label="Close"><svg data-icon="x"></svg></button>
      </div>
      <div id="install-body" class="install-body" tabindex="-1" autofocus></div>
    </dialog>
    <script src="options.js" type="module"></script>
  </body>
</html>
